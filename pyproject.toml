[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vel-pid-demo"
version = "0.1.0"
description = "Simulations comparing the velocity (incremental) and positional forms of the PID controller"
requires-python = ">=3.9"
authors = [
    {name = "Bill Tubbs"}
]
dependencies = [
    "numpy>=1.20.0",
    "matplotlib>=3.5",
    "python-pid @ git+https://github.com/billtubbs/pid-ref.git",
]

[tool.setuptools]
py-modules = ["vel_pid_demo"]
